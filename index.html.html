<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근길 래그돌</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeaff;--fg:#25203d;--ac:#ff4f7b;--ac2:#ffcf33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122a;--fg:#f6efe0}}
:root[data-theme="dark"]{--bg:#15122a;--fg:#f6efe0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
h1{font-size:1.6rem;margin:6px 0}
#w{position:relative;width:min(100%,900px);overflow:hidden;border-radius:14px}
canvas{display:block;width:100%;height:auto;background:#1d1a2f}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,16,40,.82);color:#f6efe0;text-align:center;padding:16px}
#ov[hidden]{display:none}
#ov h2{font-size:2rem;margin:0}#ov p{margin:0;font-size:1.1rem}
button{font:inherit;font-size:1.2rem;padding:10px 20px;border:0;border-radius:12px;background:var(--ac2);color:#25203d;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#ov button{margin:4px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,900px);margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button{background:var(--ac);color:#fff;padding:14px 4px;font-size:1rem}
#pad button.on{filter:brightness(1.3)}
.tip{font-size:.95rem;margin:8px 0;opacity:.85;text-align:center}
</style>
</head>
<body>
<h1>출근길 래그돌</h1>
<div id="w"><canvas id="c" width="900" height="420"></canvas><div id="ov"></div></div>
<div id="pad">
<button data-k="KeyQ">Q 왼 뒷다리</button><button data-k="KeyW">W 오른 뒷다리</button><button data-k="KeyO">O 왼팔</button><button data-k="KeyP">P 오른팔</button>
</div>
<p class="tip">네 발로 기어가요. 다리와 팔을 번갈아 눌러서 무릎과 팔꿈치를 꺾으며 전진!</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const {Engine,Bodies,Body,Composite,Constraint}=Matter;
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),W=900,H=420;
const C={goal:6000,lim:75},A0=1.2,ZE={angle:0,angularVelocity:0};
let eng,P,st='menu',keys={},tS=0,tNow=0,best=0,ob=[],pu=[],fx=[],fr=0,phH=0,last='',ph=0,act=0;
function build(){
 eng=Engine.create();
 const gnd=Bodies.rectangle(C.goal/2,380,C.goal+1400,40,{isStatic:true,friction:.3,frictionStatic:.5});
 ob=[];
 for(let X=420;X<C.goal-150;X+=110+Math.random()*80){const h=16+16*X/C.goal+Math.random()*12,b=Bodies.trapezoid(X,360-h*.45,90+Math.random()*40,h,.1,{isStatic:true,friction:.5});b.col='#ff4f7b';ob.push(b)}
 pu=[];for(let X=2800;X<C.goal-300;X+=380+Math.random()*180){pu.push({b:Bodies.rectangle(X,330,14,100,{isStatic:true,friction:.2}),X,sp:3.6+Math.random()*1.2,p0:Math.random()*6.28})}
 const mk=(X,Y,w,h,col,o)=>{const b=Bodies.rectangle(X,Y,w,h,Object.assign({collisionFilter:{group:-1},friction:.25,frictionStatic:.5,density:.002,chamfer:{radius:Math.min(w,h)/2-1}},o));b.col=col;return b};
 const torso=mk(123.3,282,20,50,'#4fa8ff',{angle:A0}),head=Bodies.circle(160,268,12,{collisionFilter:{group:-1},density:.002});
 P={torso,head};
 const J=(a,pa,b,pb,s)=>Constraint.create({bodyA:a,pointA:pa,bodyB:b,pointB:pb,length:0,stiffness:s});
 const cons=[Constraint.create({bodyA:torso,pointA:{x:0,y:-25},bodyB:head,pointB:{x:0,y:0},length:14,stiffness:.3,damping:.1})];
 [['l',-3,'#ffcf33','#e09b00'],['r',3,'#8ad0ff','#3f86c9']].forEach(([s,dx,c1,c2])=>{
  const th=mk(100,309,12,36,c1),sh=mk(100,341,10,36,c2),ua=mk(146.6,294.5,9,43,c1),fa=mk(146.6,337.5,8,43,c2);
  P[s+'t']=th;P[s+'s']=sh;P[s+'a']=ua;P[s+'b']=fa;
  cons.push(J(torso,{x:dx,y:25},th,{x:0,y:-16},.9),J(th,{x:0,y:16},sh,{x:0,y:-16},.9),J(torso,{x:dx,y:-25},ua,{x:0,y:-21.5},.9),J(ua,{x:0,y:21.5},fa,{x:0,y:-21.5},.9));
 });
 P.all=[torso,head,P.lt,P.ls,P.rt,P.rs,P.la,P.lb,P.ra,P.rb];
 Composite.add(eng.world,[gnd,...ob,...pu.map(p=>p.b),...P.all,...cons]);swing(0);
 act=0;ph=0;last='';
}
function swing(t){pu.forEach(p=>{const a=1.45*Math.max(-1,Math.min(1,1.8*Math.sin(t*p.sp+p.p0))),da=a-(p.pa===undefined?a:p.pa),bx=p.X+50*Math.sin(a),by=358-50*Math.cos(a);p.pa=a;Body.setAngle(p.b,a);Body.setPosition(p.b,{x:bx,y:by});if(st==='play'&&Math.abs(da)>.015)P.all.forEach(o=>{if(Math.hypot(o.position.x-bx,o.position.y-by)<65)Body.setVelocity(o,{x:o.velocity.x+Math.sign(da)*3.5,y:o.velocity.y-1.5})})})}
function show(h){ov.innerHTML=h;ov.hidden=false}
function menu(){st='menu';build();show('<h2>😰 출근길 래그돌</h2><p>문이 닫히기 전에 지하철까지 기어가세요</p><p>Q W 뒷다리, O P 팔. 아래 버튼으로도 돼요</p><p>후반엔 밀치는 방망이가 나와요. 방망이가 누웠을 때 지나가세요</p><button onclick="start()">출근 시작</button>')}
function start(){build();keys={};tS=performance.now();st='play';ov.hidden=true}
const dist=()=>Math.max(0,((P.torso.position.x-100)/40)|0);
function drive(){
 act=Math.max(0,act-.02);ph+=.22*act;if(fr++%9===0&&act>0){phH=ph;if(Math.random()<.6)fx.push({t:'끼익',x:P.torso.position.x+(Math.random()-.5)*120,y:300+Math.random()*50,l:40})}
 const T=P.torso,pq=Math.round(phH*1.2)/1.2,s=Math.sin(pq),c=Math.cos(pq),amp=Math.min(1,act*2),
 R=(o,p,tg)=>Body.setAngularVelocity(o,p.angularVelocity+(tg-(o.angle-p.angle))*.6+(Math.random()-.5)*.14*(amp+.2));
 R(P.lt,ZE,-s*.7*amp);R(P.rt,ZE,s*.7*amp);R(P.ls,P.lt,Math.max(0,c)*1.3*amp);R(P.rs,P.rt,Math.max(0,-c)*1.3*amp);
 R(P.la,ZE,s*.7*amp);R(P.ra,ZE,-s*.7*amp);R(P.lb,P.la,Math.max(0,-c)*1.3*amp);R(P.rb,P.ra,Math.max(0,c)*1.3*amp);
 if(act>0){const f=.025*act*(1+Math.abs(s));P.all.forEach(o=>{if(o.velocity.x<2)Body.setVelocity(o,{x:o.velocity.x+f,y:o.velocity.y})})}
 Body.applyForce(T,T.position,{x:0,y:-.0016});
 Body.setAngularVelocity(T,T.angularVelocity*.92-(T.angle-A0)*.015);
}
function press(k){
 if(st!=='play')return;
 const b=k!==last?.6:.15;last=k;act=1;
 P.all.forEach(o=>{if(o.velocity.x<2.5)Body.setVelocity(o,{x:o.velocity.x+b,y:o.velocity.y})});
 const A=(o,v)=>Body.setAngularVelocity(o,v);
 if(k==='KeyQ'){A(P.lt,-.3);A(P.ls,.5)}
 if(k==='KeyW'){A(P.rt,-.3);A(P.rs,.5)}
 if(k==='KeyO'){A(P.la,-.3);A(P.lb,.5)}
 if(k==='KeyP'){A(P.ra,-.3);A(P.rb,.5)}
}
function end(w,t){
 st='over';const d=dist();
 if(w&&(!best||t<best))best=t;
 let title,sub;
 if(w){const g=C.lim-t>=12?'출근왕 🏆':'지각 직전 생존자 🫠';title='도착! '+g;sub='오늘도 무사히 출근 완료 ('+t.toFixed(1)+'초)'}
 else{title='문이 닫혔다 🚪';sub='다음 열차는 7분 뒤입니다'}
 show('<h2>'+title+'</h2><p>'+sub+'</p><p>'+(w?'이번 '+t.toFixed(1)+'초':'도착 못함, '+d+'m 지점')+', 최고 '+(best?best.toFixed(1)+'초':'기록 없음')+'</p><div><button onclick="start()">다시 도전</button></div>');
}
function check(t){
 if(P.torso.position.x>C.goal)return end(true,t);
 if(t>C.lim)end(false,t);
}
function poly(b){x.beginPath();b.vertices.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.closePath();x.fill()}
function joint(px,py){x.fillStyle='#f6efe0';x.beginPath();x.arc(px+(Math.random()-.5)*3,py+(Math.random()-.5)*3,5,0,7);x.fill()}
function draw(){
 const T=P.torso,cx=Math.max(0,T.position.x-260);
 x.fillStyle='#1d1a2f';x.fillRect(0,0,W,H);
 x.save();x.translate(-cx,0);
 x.fillStyle='#3a3358';x.fillRect(cx-10,360,W+20,80);
 x.fillStyle='#ffcf33';x.fillRect(cx-10,358,W+20,3);
 x.font='16px Jua,sans-serif';x.textAlign='center';
 for(let m=0;m*400+100<=C.goal;m++){x.fillText(m*10+'m',100+m*400,390)}
 x.font='64px sans-serif';x.fillText('🚇',C.goal+60,350);
 ob.forEach(b=>{x.fillStyle=b.col;poly(b)});
 pu.forEach(p=>{x.fillStyle='#ff9f1c';poly(p.b);x.fillStyle='#f6efe0';x.beginPath();x.arc(p.X,358,6,0,7);x.fill()});
 [P.la,P.lb,P.lt,P.ls,T,P.ra,P.rb,P.rt,P.rs].forEach(b=>{x.fillStyle=b.col;poly(b)});
 [[P.lt,16],[P.rt,16],[P.la,21.5],[P.ra,21.5]].forEach(([b,d])=>joint(b.position.x-d*Math.sin(b.angle),b.position.y+d*Math.cos(b.angle)));
 const h=P.head;x.save();x.translate(h.position.x,h.position.y);x.rotate(h.angle);
 x.fillStyle='#ffd9a8';x.beginPath();x.arc(0,0,13,0,7);x.fill();
 x.font='20px sans-serif';x.fillText(st==='over'?'😵':'😰',0,7);x.restore();
 fx.forEach(f=>{x.globalAlpha=Math.max(0,f.l/40);x.fillStyle='#ffcf33';x.font='18px Jua,sans-serif';x.textAlign='center';x.fillText(f.t,f.x,f.y-(40-f.l));f.l--});fx=fx.filter(f=>f.l>0);x.globalAlpha=1;
 x.restore();
 x.fillStyle='#f6efe0';x.font='22px Jua,sans-serif';x.textAlign='left';
 x.fillText('🚇 까지 '+Math.max(0,((C.goal-100)/40-dist())|0)+'m',14,30);
 x.textAlign='right';x.fillStyle=C.lim-tNow<10?'#ff4f7b':'#f6efe0';
 x.fillText('문 닫힘까지 '+Math.max(0,C.lim-tNow).toFixed(1)+'초',W-14,30);
}
function loop(now){
 if(st==='play'){tNow=(now-tS)/1000;drive();swing(tNow);Engine.update(eng,1000/60);check(tNow)}
 draw();requestAnimationFrame(loop);
}
const KS=['KeyQ','KeyW','KeyO','KeyP'];
addEventListener('keydown',e=>{if(KS.includes(e.code)){if(!keys[e.code])press(e.code);keys[e.code]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(KS.includes(e.code))keys[e.code]=0});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k,on=e=>{e.preventDefault();if(!keys[k])press(k);keys[k]=1;b.classList.add('on')},off=()=>{keys[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
});
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
